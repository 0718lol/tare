name: tare harness audit
description: 审计 agent harness 的上下文 ROI，在 PR 上报告可回收 token

inputs:
  trace-dir:
    description: harness 运行记录目录
    required: false
    default: "~/.workbuddy-ai/traces"
  adapter:
    description: 适配器（workbuddy | generic）
    required: false
    default: "workbuddy"
  fail-on-droppable-percent:
    description: 死重占比超过该阈值时检查失败（0 表示不失败）
    required: false
    default: "0"
  comment:
    description: 是否把结果回写到 PR
    required: false
    default: "true"

outputs:
  droppable-tokens:
    description: 可回收的 token 数
    value: ${{ steps.audit.outputs.droppable }}
  droppable-percent:
    description: 死重占 system prompt 的百分比
    value: ${{ steps.audit.outputs.percent }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install tare
      shell: bash
      run: pip install -e "${{ github.action_path }}/.."

    - name: Run audit
      id: audit
      shell: bash
      run: |
        tare audit --adapter "${{ inputs.adapter }}" \
                   --trace-dir "${{ inputs.trace-dir }}" \
                   --format md -o tare-audit.md
        tare audit --adapter "${{ inputs.adapter }}" \
                   --trace-dir "${{ inputs.trace-dir }}" \
                   --format json -o tare-audit.json
        python - <<'PY'
        import json, os
        d = json.load(open("tare-audit.json", encoding="utf-8"))
        tok = d.get("droppable_tokens", 0)
        pct = tok / d["system_tokens"] * 100 if d.get("system_tokens") else 0
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"droppable={tok}\n")
            f.write(f"percent={pct:.2f}\n")
        PY

    - name: Comment on PR
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('tare-audit.md', 'utf8');
          const marker = '<!-- tare-audit -->';
          const text = `${marker}\n${body}`;
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const prev = comments.find(c => c.body.includes(marker));
          if (prev) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: prev.id, body: text,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body: text,
            });
          }

    - name: Gate
      if: inputs.fail-on-droppable-percent != '0'
      shell: bash
      run: |
        PCT="${{ steps.audit.outputs.percent }}"
        LIMIT="${{ inputs.fail-on-droppable-percent }}"
        echo "死重占比: ${PCT}% (阈值 ${LIMIT}%)"
        python -c "
        import sys
        pct, limit = float('${PCT}'), float('${LIMIT}')
        sys.exit(1 if pct > limit else 0)
        "
