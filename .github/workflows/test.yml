name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest tests/ -v

      - name: Smoke test — audit on example traces
        run: tare audit --adapter generic --trace-dir examples/traces

      - name: Smoke test — JSON output is valid
        run: |
          tare audit --adapter generic --trace-dir examples/traces --format json > /tmp/out.json
          python -c "import json; d=json.load(open('/tmp/out.json')); assert 'blocks' in d; print('blocks:', len(d['blocks']))"

      - name: Smoke test — info subcommand
        run: tare info --adapter generic --trace-dir examples/traces

      - name: Smoke test — markdown output
        run: tare audit --adapter generic --trace-dir examples/traces --format md -o /tmp/audit.md && test -s /tmp/audit.md

      - name: CLI works standalone
        run: tare --version
