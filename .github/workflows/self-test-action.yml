name: self-test action

# Exercises the composite action against the bundled example traces.
# This is the real M3 check: does action.yml work when GitHub runs it,
# not just when we replay its steps locally?

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "action.yml"
      - ".github/workflows/self-test-action.yml"
      # the action installs the package, so a change to the package can
      # break it just as easily as a change to action.yml itself
      - "tare/**"
      - "pyproject.toml"
  pull_request:

jobs:
  run-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the tare action on example traces
        id: tare
        uses: ./
        with:
          adapter: generic
          trace-dir: examples/traces
          comment: "false"
          fail-on-droppable-percent: "0"

      - name: Assert outputs are populated
        shell: bash
        run: |
          echo "droppable-tokens  = ${{ steps.tare.outputs.droppable-tokens }}"
          echo "droppable-percent = ${{ steps.tare.outputs.droppable-percent }}"
          test -n "${{ steps.tare.outputs.droppable-tokens }}" || { echo "::error::droppable-tokens empty"; exit 1; }
          test -n "${{ steps.tare.outputs.droppable-percent }}" || { echo "::error::droppable-percent empty"; exit 1; }

      - name: Assert the gate actually fails when the limit is exceeded
        id: gate
        continue-on-error: true
        uses: ./
        with:
          adapter: generic
          trace-dir: examples/traces
          comment: "false"
          fail-on-droppable-percent: "1"

      - name: Confirm the gate tripped
        shell: bash
        run: |
          if [ "${{ steps.gate.outcome }}" != "failure" ]; then
            echo "::error::gate should have failed at limit=1 (droppable is 52%), got '${{ steps.gate.outcome }}'"
            exit 1
          fi
          echo "gate correctly failed at limit=1"

      # The lang input is easy to add to action.yml and forget to wire into the
      # audit invocation -- then the action silently emits English forever.
      - name: Run the action with lang=zh
        id: zh
        uses: ./
        with:
          adapter: generic
          trace-dir: examples/traces
          comment: "false"
          lang: "zh"

      - name: Assert the zh report is actually Chinese
        shell: bash
        run: |
          # verify the CLI default too, so a regression in either direction is caught
          tare audit --adapter generic --trace-dir examples/traces --lang en --format md -o /tmp/en.md
          tare audit --adapter generic --trace-dir examples/traces --lang zh --format md -o /tmp/zh.md

          grep -q "## Summary" /tmp/en.md || { echo "::error::--lang en did not produce English headings"; cat /tmp/en.md; exit 1; }
          grep -q "核心结论\|区块明细" /tmp/zh.md || { echo "::error::--lang zh did not produce Chinese headings"; cat /tmp/zh.md; exit 1; }

          if grep -q "## Summary" /tmp/zh.md; then
            echo "::error::--lang zh still emitted English headings"
            exit 1
          fi

          echo "en headings : $(grep -c '^## ' /tmp/en.md)"
          echo "zh headings : $(grep -c '^## ' /tmp/zh.md)"
          echo "language switching works in both directions"

      - name: Assert the lang input is exposed and reaches the CLI
        shell: bash
        run: |
          # action.yml must declare the input and pass it to every audit call
          grep -q "^  lang:" action.yml || { echo "::error::action.yml does not declare a lang input"; exit 1; }
          n=$(grep -c -- '--lang "\${{ inputs.lang }}"' action.yml)
          if [ "$n" -ne 2 ]; then
            echo "::error::--lang should be passed to both audit invocations (md + json), found $n"
            exit 1
          fi
          echo "lang input declared and passed to $n audit invocations"

  pr-comment:
    # Exercises the PR-comment path, which the job above cannot reach:
    # it is gated on github.event_name == 'pull_request'.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Run the tare action with commenting enabled
        id: tare
        uses: ./
        with:
          adapter: generic
          trace-dir: examples/traces
          comment: "true"

      - name: Report what happened
        shell: bash
        run: |
          echo "droppable-tokens  = ${{ steps.tare.outputs.droppable-tokens }}"
          echo "droppable-percent = ${{ steps.tare.outputs.droppable-percent }}"
